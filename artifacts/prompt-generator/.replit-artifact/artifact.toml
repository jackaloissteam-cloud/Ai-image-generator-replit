kind = "web"
previewPath = "/"
title = "Cinematic Prompt Generator"
version = "1.0.0"
id = "artifacts/prompt-generator"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 3000

[services.development]
run = "pnpm --filter @workspace/prompt-generator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/prompt-generator", "run", "build" ]
publicDir = "artifacts/prompt-generator/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "3000"
BASE_PATH = "/"
